<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & OTP Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: #6a11cb;
            color: white;
            padding: 25px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-container {
            padding: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: #6a11cb;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            font-size: 20px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 600;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
            font-size: 14px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a11cb;
        }

        .input-with-icon input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-with-icon input:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 2px rgba(106, 17, 203, 0.2);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #6a11cb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(106, 17, 203, 0.3);
        }

        .btn:hover {
            background: #5a0fb8;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(106, 17, 203, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .otp-container {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .otp-header {
            background: #2575fc;
            color: white;
            padding: 25px 30px;
            text-align: center;
        }

        .otp-header h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .otp-message {
            text-align: center;
            margin-bottom: 25px;
            color: #666;
            line-height: 1.5;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .otp-inputs input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .otp-inputs input:focus {
            border-color: #2575fc;
            box-shadow: 0 0 0 2px rgba(37, 117, 252, 0.2);
            outline: none;
            transform: scale(1.05);
        }

        .back-to-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-to-login a {
            color: #2575fc;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
        }

        .back-to-login a i {
            margin-right: 5px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-animation {
            display: none;
            text-align: center;
            margin-bottom: 20px;
        }

        .success-animation i {
            font-size: 50px;
            color: #4CAF50;
            animation: scaleUp 0.5s ease;
        }

        @keyframes scaleUp {
            0% {
                transform: scale(0);
            }

            70% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .resend-otp {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .resend-otp a {
            color: #2575fc;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Login Form -->
        <div class="login-container" id="login-container">
            <div class="header">
                <h1>Signup Form</h1>
                <p>It's very simple process</p>
            </div>

            <div class="form-container">
                <div class="brand">
                    <div class="brand-icon">
                        <i class="fas fa-code"></i>
                    </div>
                    <div class="brand-name">BALAKRISHNAN FORM</div>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" placeholder="codingnepalweb@gmail.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="button" class="btn" id="login-btn">Signup</button>

                    <div class="login-link">
                        Already a member? <a href="#">Login here</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- OTP Verification -->
        <div class="otp-container" id="otp-container">
            <div class="otp-header">
                <h2>OTP Verification</h2>
            </div>

            <div class="form-container">
                <div class="success-animation" id="success-animation">
                    <i class="fas fa-check-circle"></i>
                </div>

                <div class="otp-message">
                    We've sent a verification code to your email<br>
                    <strong id="user-email">codingnepalweb@gmail.com</strong>
                </div>

                <div class="otp-inputs">
                    <input type="text" maxlength="1" oninput="moveToNext(this, 1)">
                    <input type="text" maxlength="1" oninput="moveToNext(this, 2)">
                    <input type="text" maxlength="1" oninput="moveToNext(this, 3)">
                    <input type="text" maxlength="1" oninput="moveToNext(this, 4)">
                    <input type="text" maxlength="1" oninput="moveToNext(this, 5)">
                    <input type="text" maxlength="1" oninput="moveToNext(this, 6)">
                </div>

                <button type="button" class="btn" id="verify-btn">Submit</button>

                <div class="resend-otp">
                    Didn't receive the code? <a href="#">Resend OTP</a>
                </div>

                <div class="back-to-login">
                    <a href="#" id="back-to-login"><i class="fas fa-arrow-left"></i> Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginContainer = document.getElementById('login-container');
            const otpContainer = document.getElementById('otp-container');
            const loginBtn = document.getElementById('login-btn');
            const verifyBtn = document.getElementById('verify-btn');
            const backToLogin = document.getElementById('back-to-login');
            const userEmail = document.getElementById('user-email');
            const emailInput = document.getElementById('email');
            const successAnimation = document.getElementById('success-animation');

            // Handle login button click
            loginBtn.addEventListener('click', function () {
                if (emailInput.value) {
                    userEmail.textContent = emailInput.value;
                }

                // Hide login, show OTP with animation
                loginContainer.style.display = 'none';
                otpContainer.style.display = 'block';
            });

            // Handle back to login
            backToLogin.addEventListener('click', function () {
                otpContainer.style.display = 'none';
                loginContainer.style.display = 'block';
            });

            // Handle OTP verification
            verifyBtn.addEventListener('click', function () {
                // Show success animation
                successAnimation.style.display = 'block';

                // Change button text
                verifyBtn.textContent = 'Verified Successfully!';
                verifyBtn.style.background = '#4CAF50';

                // Reset after 2 seconds
                setTimeout(function () {
                    successAnimation.style.display = 'none';
                    verifyBtn.textContent = 'Submit';
                    verifyBtn.style.background = '#6a11cb';
                    otpContainer.style.display = 'none';
                    loginContainer.style.display = 'block';

                    // Clear OTP inputs
                    const otpInputs = document.querySelectorAll('.otp-inputs input');
                    otpInputs.forEach(input => input.value = '');

                    // Clear password field
                    document.getElementById('password').value = '';
                }, 2000);
            });
        });

        // Function to move to next OTP input
        function moveToNext(current, nextIndex) {
            if (current.value.length === 1) {
                const nextInput = document.querySelector(`.otp-inputs input:nth-child(${nextIndex + 1})`);
                if (nextInput) nextInput.focus();
            }
        }
    </script>
</body>

</html>
